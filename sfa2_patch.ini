# Street Fighter Alpha 2 (PC) - XInput & Modernization Mod Configuration

[Graphics]
; Trava o motor da Capcom em 60 FPS estritos (17ms por quadro)
; Desativa o 'Auto Frame-Skip' interno da Capcom que causava sensacao de pulos de quadro.
; 1 = Ativado (Recomendado), 0 = Desativado
Force60FPS = 1



[Controllers]
; Index do controle no Windows/XInput para o Player 1 (padrao: 0)
Player1_Index = 0

; Index do controle no Windows/XInput para o Player 2 (padrao: 1)
; Se o Player 2 nao estiver conectado, ele fica completamente inativo/desconectado.
Player2_Index = 1

[Audio]
; Mantem a musica de fundo tocando continuamente durante o K.O. e transicao de rounds (comportamento Arcade CPS2)
; 1 = Ativado (Recomendado - musica continua sem corte/mute no KO)
; 0 = Desativado (Comportamento original do PC port onde a musica abaixa/pausa no KO)
ContinuousBGMOnKO = 1

; Ducking seletivo de volume de BGM ao finalizar o round com Super Combo (Super Finish):
; O fade ocorre no momento exato em que a tela pisca com a explosao amarela ou azul (Super Flash).
; Se o round terminar com golpes normais ou especiais (Shoryuken, Hadouken, etc.), o volume continua a 100%.
; 1 = Ativado (Recomendado), 0 = Desativado
DuckBGMOnSuperKO = 1

; Percentual de volume da musica durante o Super Finish (padrao: 30)
; 30 = 30% do volume (-1050 mB em DirectSound)
SuperKOBGMVolumePercent = 30

; Duracao do fade de volume no momento do flash do Super em milissegundos (padrao: 250)
SuperKOFadeDurationMS = 250

[XInput]
; Habilita suporte nativo a XInput (1 = Ativado, 0 = Desativado)
Enabled = 1

; Zona morta do analogico esquerdo (0 a 32767, padrao: 7849)
Deadzone = 7849

; Habilita macros de 3 Socos (LB) e 3 Chutes (LT) para Supers / Alpha Counters (1 = Sim, 0 = Nao)
EnableMacros = 1

; Troca a disposicao de Golpes Fortes entre Bumpers e Gatilhos:
; 0 = Padrao Arcade/M30 (X, Y, RB = Socos | A, B, RT = Chutes)
; 1 = Invertido (X, Y, RT = Socos | A, B, RB = Chutes)
SwapTriggersBumpers = 0

[Debug]
; Ativa log diagnostico em sfa2_patch.log (1 = Sim, 0 = Nao)
EnableLog = 0
