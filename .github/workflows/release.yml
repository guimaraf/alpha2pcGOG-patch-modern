name: Package and Release Patch

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release title'
        required: false
        default: 'Street Fighter Alpha 2 Modern Patch'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Package alpha2gogModernPatch.zip & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          REQUIRED_FILES=("ddraw.dll" "DDrawCompat.ini" "dinput.dll" "sfa2_patch.ini" "LEIAME.txt")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found: $file"
              exit 1
            fi
          done
          echo "All 5 required files located successfully."

      - name: Create release ZIP (alpha2gogModernPatch.zip)
        run: |
          zip -j alpha2gogModernPatch.zip \
            ddraw.dll \
            DDrawCompat.ini \
            dinput.dll \
            sfa2_patch.ini \
            LEIAME.txt

          echo "::group::Archive contents (alpha2gogModernPatch.zip)"
          unzip -l alpha2gogModernPatch.zip
          echo "::endgroup::"

      - name: Determine Tag, Title and Notes
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="Street Fighter Alpha 2 - Modern Patch ${{ github.ref_name }}"
            PRERELEASE="false"
          fi

          if [ -z "$TITLE" ]; then
            TITLE="Street Fighter Alpha 2 - Modern Patch $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload alpha2gogModernPatch.zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: alpha2gogModernPatch.zip
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          body: |
            ### 📦 Package Contents (`alpha2gogModernPatch.zip`)
            - `ddraw.dll` - DDrawCompat v0.7.2 (DirectDraw 3 to Direct3D 11 translation layer)
            - `DDrawCompat.ini` - Graphics configuration (native desktop resolution, integer 4:3 point scaling, borderless fullscreen)
            - `dinput.dll` - DirectInput proxy with native XInput controller support and 60 FPS lock
            - `sfa2_patch.ini` - Configuration file for controllers, audio, and gameplay settings
            - `LEIAME.txt` - Instructions and button mapping reference

            ### 🚀 Quick Installation (GOG Release)
            1. Download **`alpha2gogModernPatch.zip`** below under **Assets**.
            2. Extract all contents directly into your **Street Fighter Alpha 2** game installation directory (where `ALPHA2.EXE` is located).
            3. Launch the game normally via the GOG shortcut or `ALPHA2.EXE`.
