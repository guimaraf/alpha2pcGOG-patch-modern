# DDrawCompat Configuration for Street Fighter Alpha 2 (PC)
# Converts DirectDraw to Direct3D 11 with smooth 60 FPS and 4:3 Aspect Ratio

# Display & Fullscreen
FullscreenMode = borderless
DisplayResolution = desktop
DisplayAspectRatio = 4:3
DisplayFilter = point
VSync = off

# Performance & Timing (FpsLimiter off avoids conflict with the game's native 60fps loop)
CpuAffinity = 1
FpsLimiter = off

# Colors & Rendering
RenderColorDepth = app

# Compatibility & Stability
AltTabFix = keepvidmem

# Hotkeys (Shift+F12 shows built-in FPS/Stats overlay, Shift+F11 opens config overlay)
ConfigHotKey = shift+f11
StatsHotKey = shift+f12
